<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book AI - Universal Deep Research Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-[#f8f9fe] min-h-screen font-sans text-slate-900">
    <nav class="flex justify-between items-center px-8 py-4 bg-white/80 border-b border-slate-200">
        <div class="text-2xl font-extrabold text-indigo-700 tracking-tight">Book AI</div>
        <div class="text-xs font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
            Global Knowledge Network
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-16 px-4 pb-20 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
            Universal Deep Research Engine
        </h1>
        <p class="text-slate-500 text-lg max-w-2xl mx-auto mb-10">
            Ask any academic query. Our system scours verified web data and constructs a comprehensive textbook breakdown.
        </p>

        <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex items-center max-w-2xl mx-auto">
            <input id="queryInput" type="text" maxlength="300"
                placeholder="What is an introductory overview of Machine Learning"
                class="w-full px-4 py-3 bg-indigo-50/50 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base"
                onkeydown="if(event.key === 'Enter') generateChapter()" />
            <button id="generateBtn" onclick="generateChapter()"
                class="ml-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold px-6 py-3 rounded-xl transition whitespace-nowrap shadow-sm">
                Generate Chapter
            </button>
        </div>

        <div id="loadingStatus" class="hidden mt-6 text-indigo-600 font-semibold flex items-center justify-center gap-2 animate-pulse">
            <span>⚡ Searching the live web and writing your chapter... the first request can take up to a minute.</span>
        </div>

        <div id="errorBox" class="hidden mt-6 max-w-2xl mx-auto text-left bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm"></div>

        <div id="outputContainer" class="hidden mt-10 text-left bg-white p-8 md:p-10 rounded-2xl shadow-md border border-slate-200 prose prose-slate max-w-none leading-relaxed"></div>
    </main>

    <script>
        // >>> CHANGE THIS to your Render backend URL (no trailing slash) <<<
        const API_URL = "https://knowledge-is-power-lyyn.onrender.com/";

        async function generateChapter() {
            const input = document.getElementById('queryInput');
            const loading = document.getElementById('loadingStatus');
            const output = document.getElementById('outputContainer');
            const errorBox = document.getElementById('errorBox');
            const btn = document.getElementById('generateBtn');
            const question = input.value.trim();

            if (!question) {
                errorBox.textContent = "Please enter an academic query first.";
                errorBox.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            output.classList.add('hidden');
            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');

            try {
                const response = await fetch(API_URL + '/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Unknown error occurred on the server.');
                }

                output.innerHTML = marked.parse(data.answer);
                output.classList.remove('hidden');
            } catch (err) {
                errorBox.textContent = err.message || "Could not reach the server. Please try again.";
                errorBox.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
